{% extends "layouts/main.html" %} {% block content %}
<div class="govuk-width-container">
    <a routerLink="/email" class="govuk-back-link">Back</a>
    <h1 class="govuk-heading-l">Find an address</h1>
    <form class="form" action="/postcodeLookupContinue" method="post">
            <div [ngClass]="{ 'govuk-form-group--error': !postcodeValid }" id="postcode-input" class="govuk-form-group">
                <label class="govuk-label" for="postcode"> Postcode </label>
                <div id="postcode-hint" class="govuk-hint">For example, AA3 1AB.</div>
                <input [ngClass]="{ 'govuk-input--error': !postcodeValid }" class="govuk-input govuk-!-width-two-thirds"
                    formControlName="postcode" id="postcode" name="postcode" type="text"
                    aria-describedby="postcode-hint" />
            </div>
        <label class="govuk-label" for="searchString">
            Building number or name
        </label>
        <div id="searchString-hint" class="govuk-hint">
            For example, 15 or Prospect Cottage.
        </div>
        <input [ngClass]="{ 'govuk-input--error': !addressLineOneValid }" formControlName="line1"
            class="govuk-input govuk-!-width-two-thirds" id="searchString" name="searchString" type="text"
            aria-describedby="searchString-hint" />
</div>
</br>
<button href="/chooseAddress" type="submit" class="govuk-button" data-module="govuk-button">
    Find address
</button>
</form>
<p class="govuk-body govuk-!-margin-bottom-0">
    <a href="/enterAddressManually" class="govuk-link">Enter address manually</a>
</p>
</div>

{% endblock %}
